name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  myjob:
    runs-on: Self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          repository: Anshulpostman/playwrightautomation
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Find Changed Test Files (Windows)
        id: changed-tests
        shell: powershell
        run: |
          $CHANGED_FILES = git diff --name-only $env:GITHUB_EVENT_BEFORE $env:GITHUB_SHA | Select-String 'tests/' | ForEach-Object { $_.Line }
          if ($CHANGED_FILES) {
            echo "::set-output name=CHANGED_FILES::$CHANGED_FILES"
          } else {
            echo "::set-output name=CHANGED_FILES::"
          }
        continue-on-error: true  # Prevent failure if no files are found

      - name: Debug Changed Files
        shell: powershell
        run: |
          echo "Detected Changed Files: ${{ steps.changed-tests.outputs.CHANGED_FILES }}"

      - name: Run Only Changed Tests
        if: steps.changed-tests.outputs.CHANGED_FILES != ''
        shell: powershell
        run: |
          echo "Running tests for changed files:"
          echo "${{ steps.changed-tests.outputs.CHANGED_FILES }}"
          $files = "${{ steps.changed-tests.outputs.CHANGED_FILES }}" -split "\s+"
          npx playwright test $files --reporter=html