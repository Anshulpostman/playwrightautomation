name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  myjob:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          repository: Anshulpostman/playwrightautomation
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Fetch All Git History
        run: powershell -ExecutionPolicy Bypass -Command "git fetch --prune --unshallow"


      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Find Changed Test Files (Windows)
        id: changed-tests
        shell: powershell
        run: |
          $CHANGED_FILES = git diff --name-only origin/${{ github.event.repository.default_branch }} | Select-String 'tests/' | ForEach-Object { $_.Line }
          if ($CHANGED_FILES) {
            echo "::set-output name=CHANGED_FILES::$CHANGED_FILES"
          } else {
            echo "::set-output name=CHANGED_FILES::"
          }
        continue-on-error: true  

      - name: Debug Changed Files
        shell: powershell
        run: |
          git diff --name-only origin/${{ github.event.repository.default_branch }}
          echo "Detected Changed Files: ${{ steps.changed-tests.outputs.CHANGED_FILES }}"

      - name: Run Only Changed Tests
        if: steps.changed-tests.outputs.CHANGED_FILES != '' && steps.changed-tests.outputs.CHANGED_FILES != null
        shell: powershell
        run: |
          $files = "${{ steps.changed-tests.outputs.CHANGED_FILES }}" -split "\s+"
          if ($files.Count -gt 0) {
            npx playwright test $files --reporter=html
          } else {
            echo "No test files changed. Skipping tests."
          }
