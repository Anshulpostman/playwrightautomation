name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Identify Changed Files
        id: changes
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed-files.txt
          if grep -q '^tests/' changed-files.txt; then
            echo "Changed test files detected"
          else
            echo "No relevant test file changes detected"
            echo "::set-output name=skip::true"
          fi

      - name: Run Playwright Tests
        if: ${{ steps.changes.outputs.skip != 'true' }}
        run: |
          CHANGED_TESTS=$(grep '^tests/' changed-files.txt || echo '')
          if [ -n "$CHANGED_TESTS" ]; then
            npx playwright test $CHANGED_TESTS --reporter=html
          else
            echo "No specific test files to run."
          fi

      - name: Debug Directory Structure
        run: ls -R  # Lists all files and directories

      - name: Upload Playwright Report
        if: ${{ steps.changes.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright Report
          path: playwright-report/