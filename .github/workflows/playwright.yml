name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  myjob:
    runs-on: Self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          repository: Anshulpostman/playwrightautomation
          ref: main
          token: ${{ secrets.PAT_TOKEN }}  # Correct token reference

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Find Changed Test Files (Windows)
        id: changed-tests
        shell: pwsh
        run: |
          $CHANGED_FILES = git diff --name-only $env:GITHUB_EVENT_BEFORE $env:GITHUB_SHA | Select-String 'tests/' 
          if ($CHANGED_FILES) {
            echo "CHANGED_FILES=$CHANGED_FILES" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            echo "CHANGED_FILES=" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Run Only Changed Tests (Windows)
        if: env.CHANGED_FILES != ''
        shell: pwsh
        run: |
          Write-Output "Running tests for changed files:"
          Write-Output "$env:CHANGED_FILES"
          npx playwright test $env:CHANGED_FILES --reporter=html
